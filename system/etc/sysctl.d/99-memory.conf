# Ajustes de memoria para swap en zram (ver ArchWiki: Zram#Optimizing swap on zram).

# Con zram, swapear páginas anónimas es más barato que tirar caché de archivos
# (que después hay que releer del disco), así que se favorece el swap (0-200).
vm.swappiness = 180

# zram no se beneficia de leer páginas vecinas por adelantado: leer de a 1.
vm.page-cluster = 0

# Que kswapd empiece a liberar memoria antes y no haga picos de reclaim.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Magic SysRq: Alt+ImprPant+F invoca el OOM killer a mano si algo se escapa,
# Alt+ImprPant+REISUB reinicia limpio. 244 = sync+remount-ro+señales+reboot+unraw.
kernel.sysrq = 244
