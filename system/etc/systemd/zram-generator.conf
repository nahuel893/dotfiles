# Swap comprimido en RAM. Las páginas que el kernel saca de memoria se
# comprimen (~3:1 con zstd) en vez de ir al disco, así que "swapear" cuesta
# microsegundos de CPU y no milisegundos de I/O. Es lo que evita el freeze.
#
# Prioridad 100 > la del swap en disco (negativa): el kernel llena zram primero
# y el swap en disco queda para hibernar.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
