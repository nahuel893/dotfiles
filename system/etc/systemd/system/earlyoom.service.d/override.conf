# earlyoom mata el proceso más gordo ANTES de que el sistema entre en thrashing.
# El OOM killer del kernel sólo actúa cuando ya no queda nada que liberar, y para
# ese momento el sistema lleva minutos clavado releyendo código del disco.
#
# Drop-in en vez de /etc/default/earlyoom: systemd parte $EARLYOOM_ARGS por
# espacios sin respetar comillas, y las regex de abajo tienen espacios.
[Service]
ExecStart=
# -m 5      : SIGTERM con <=5% de RAM disponible, SIGKILL con <=2.5%.
# -s 100,100: ignorar el swap. Con 16 GB de swap en disco nunca bajaría del 10%
#             libre antes de que la máquina ya esté clavada.
# -r 3600   : reporte de memoria al journal una vez por hora.
# $$ es un '$' literal en ExecStart.
ExecStart=/usr/bin/earlyoom -m 5 -s 100,100 -r 3600 \
    --avoid "^(sway|Hyprland|Xwayland|waybar|kitty|alacritty|ghostty|pipewire|pipewire-pulse|wireplumber|sddm|sddm-helper|lightdm|systemd|systemd-logind|dbus-daemon|dbus-broker|sshd)$$" \
    --prefer "^(Web Content|Isolated Web Co|WebExtensions|chrome|chromium|electron|java)$$"
# Que earlyoom siga corriendo fluido cuando todo lo demás está bajo presión.
Nice=-20
OOMScoreAdjust=-1000
