# Classic dark terminal — Tango ANSI palette on near-black.
#
# Included AFTER `include matugen.conf` in kitty.conf, so it overrides whatever
# theme-switch.sh last wrote WITHOUT editing that generated file. This decouples
# kitty from the system-wide theme on purpose: waybar/rofi/sway/mako/nvim keep
# following theme-switch.sh, kitty stays here.
#
# To hand kitty back to theme-switch.sh, comment out the include line in
# kitty.conf. Nothing else needs to change.

# ── Base ──
foreground           #d0d0d0
background           #0c0c0c
cursor               #d0d0d0
cursor_text_color    #0c0c0c
selection_foreground #0c0c0c
selection_background #d3d7cf

# ── The 16 ANSI colors (Tango) ──
# black
color0  #1c1c1c
color8  #4d4d4d
# red
color1  #cc0000
color9  #ef2929
# green
color2  #4e9a06
color10 #8ae234
# yellow
color3  #c4a000
color11 #fce94f
# blue
color4  #3465a4
color12 #729fcf
# magenta
color5  #75507b
color13 #ad7fa8
# cyan
color6  #06989a
color14 #34e2e2
# white
color7  #d3d7cf
color15 #eeeeec
